<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" width="780" height="220" role="img" aria-label="Emel: a figure looking to the horizon, hair flowing back as a musical stave, notes lifting off it like birds">
  <defs>
    <g id="note">
      <ellipse cx="0" cy="0" rx="7" ry="5" transform="rotate(-24)" fill="#5A2A1E"/>
      <path d="M5.5 -2 V-26" stroke="#5A2A1E" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M5.5 -26 C 14 -22, 16 -14, 11 -8" stroke="#5A2A1E" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    </g>
  </defs>
  <!-- horizon and a low sun: the goal -->
  <line x1="284" y1="116" x2="384" y2="116" stroke="#C8792A" stroke-width="4" stroke-linecap="round"/>
  <path d="M326 116 A 22 22 0 0 1 370 116 Z" fill="#C8792A"/>
  <!-- the stave: five hair lines sweeping back from behind the head -->
  <g fill="none" stroke="#5A2A1E" stroke-width="3" stroke-linecap="round">
    <path d="M246 64 C 206 40, 132 44, 60 78"/>
    <path d="M248 78 C 206 60, 134 66, 52 100"/>
    <path d="M248 92 C 206 80, 136 88, 46 122"/>
    <path d="M248 106 C 208 100, 140 110, 42 144"/>
    <path d="M250 120 C 210 122, 144 134, 40 166"/>
  </g>
  <!-- faceless profile silhouette, looking right; drawn after the hair so the head covers its roots -->
  <path d="M228 52
           C 250 54, 262 74, 262 96
           C 262 104, 268 108, 270 114
           C 268 118, 262 118, 260 120
           C 264 124, 266 130, 260 134
           C 264 138, 262 144, 256 148
           C 250 154, 248 160, 246 168
           C 244 178, 244 184, 238 190
           C 226 198, 200 202, 176 208
           L 176 220 L 270 220 L 270 208
           C 262 206, 262 198, 264 190
           C 262 176, 250 164, 238 154
           C 206 134, 198 104, 204 80
           C 208 64, 218 52, 228 52 Z"
        fill="#5A2A1E"/>
  <!-- notes lifting off the stave like birds, towards the horizon -->
  <use href="#note" transform="translate(150 64) rotate(-10)"/>
  <use href="#note" transform="translate(112 86) rotate(-6)"/>
  <use href="#note" transform="translate(84 116) rotate(-2)"/>
  <use href="#note" transform="translate(178 46) rotate(-14) scale(.85)"/>
  <use href="#note" transform="translate(206 30) rotate(-18) scale(.7)"/>
  <use href="#note" transform="translate(304 84) rotate(-16) scale(.8)"/>
  <use href="#note" transform="translate(340 62) rotate(-20) scale(.7)"/>
  <use href="#note" transform="translate(372 44) rotate(-22) scale(.6)"/>
  <!-- wordmark -->
  <text x="430" y="120" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="92" fill="#5A2A1E">Emel<tspan fill="#C8792A">.</tspan></text>
  <text x="432" y="160" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#6F6659">Moving towards your goal.</text>
</svg>
